<text x="601" y="124" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="13" fill="#176a9b">今回のUART監視</text>
<text x="601" y="147" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="11" fill="#7735a4">#01 GP0 → 変換基板 RXD</text>
<text x="601" y="171" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="11" fill="#213244">#17 GND → 変換基板 GND</text>
<text x="601" y="196" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#176a9b">#02 GP1：今回は未接続</text>
<text x="601" y="219" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#213244">監視：115200bps / 8N1</text>
<text x="601" y="242" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#213244">3.3Vロジック / RS232不可</text>
<rect x="591" y="273" width="224" height="133" fill="#fff6ed" stroke="#ba762a"/>
<text x="601" y="294" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="12" fill="#8e551a">番号の読み方</text>
<text x="601" y="316" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#8e551a">「#」は回路図P1の端子番号。</text>
<text x="601" y="338" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#8e551a">「GP」はGPIO番号。</text>
<text x="601" y="360" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#8e551a">親Picoの40pin番号や、</text>
<text x="601" y="382" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#8e551a">RP2350 ICの端子番号とは別。</text>
<text x="30" y="479" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#176a9b">内部専用：GP12=D+ / GP13=D-（USB-A）、GP16=RGB LED。上の18端子には出ていません。</text>
<text x="30" y="500" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="11" fill="#bf3434">電源：#18=5V入力の候補 / #16=3V3。5Vを#16やGPIOへ接続しない。</text>
<text x="30" y="521" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#bf3434">USB-A VBUS・USB-C VBUS・#18は同一VSYS。外部5VとPC USB給電を同時直結しない。</text>
<text x="30" y="546" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="8.5" fill="#647483">原典：Waveshare RP2350-USB-A.pdf（P1）、Waveshare_Pinout.jpg。現物の基板版・端子表示で最終照合。</text>
