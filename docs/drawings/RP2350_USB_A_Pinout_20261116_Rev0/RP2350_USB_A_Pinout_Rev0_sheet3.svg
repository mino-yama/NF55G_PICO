<text x="601" y="178" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#8e551a">GP0 / #01：左上。</text>
<text x="601" y="204" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#8e551a">5V / #18：右上。</text>
<text x="601" y="230" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#8e551a">GND / #17：右上から2番。</text>
<text x="601" y="256" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#8e551a">3V3 / #16：右上から3番。</text>
<rect x="591" y="300" width="224" height="108" fill="#f1f5fb" stroke="#176a9b"/>
<text x="601" y="321" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="12" fill="#176a9b">はんだ付け前に</text>
<text x="601" y="344" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#176a9b">表面シルクと本図を照合。</text>
<text x="601" y="367" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#176a9b">「#」は回路図P1の番号。</text>
<text x="601" y="390" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#176a9b">基板を上下逆にしない。</text>
<text x="30" y="481" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#213244">見方：部品面の図からUSB-Cを上に保って左右へ裏返した図。上下方向も変える場合は再照合。</text>
<text x="30" y="504" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="11" fill="#bf3434">#18は5V / VSYS、#16は3V3。電源の左右取り違えに注意。無給電で施工する。</text>
<text x="30" y="527" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="10" fill="#213244">図は位置確認用。基板版・実装済み配線と照合し、試作完了後に必要な端子だけ施工する。</text>
<text x="30" y="547" font-family="MS Gothic, Noto Sans CJK JP, sans-serif" font-size="9" fill="#647483">原典：Waveshare RP2350-USB-A.pdf（P1）と部品面ピン配置図から左右反転して作成。</text>
